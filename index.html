<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard using CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo"> DevTrack</a>

            <div class="searchbar">
                <input type="text" placeholder="   Search..." id="search-text"><button type="button">🔍</button>
            </div>

            <div class="profile">
                <button type="button"> 🔔 <span class="badge">3</span></button>

                <button type="button"> 👤 Xai </button>
            </div>
        </nav>
    </header>

    <aside class="sidebar">
        <a href="#"> 🏠 Dashboard </a>
        <a href="#"> 📚 Learning </a>
        <a href="#"> 💻 Projects </a>
        <a href="#"> 📝 Notes </a>
        <a href="#"> ⚙️ Settings </a>
    </aside>

    <main>
        <div class="maincard">
            <div class="greeting">
                <p> Good day, Developer 👋 </p>
                <p> Here's your learning progress. </p>
            </div>

            <div class="cards">
                <div class="card">
                    <p>Courses</p>
                    <p>12</p>
                </div>

                <div class="card"> 
                    <p>Projects</p>
                    <p>4</p>
                </div>

                <div class="card"> 
                    <p>GitHub</p>
                    <p>18</p>
                </div>
            </div>

            <div class="learn">
                <p class="title">Learning Progress</p>
                <div class="course"> HTML ✅ </div>
                <div class="course"> CSS ✅ </div>
                <div class="course"> JavaScript 35% </div>
            </div>

            <div class="upcoming">
                <p class="title"> This Week </p>
                <div> CSS Grid: <br> 5 lessons completed!</div>
            </div>
        </div>
    </main>
</body>

</html>
